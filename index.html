<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WarEra · Political View → WarEra+</title>

  <!-- Political View è confluita in WarEra+: questa pagina spiega dove trovare
       la parte politica e rimanda alla versione live dopo un breve conto alla
       rovescia. Il codice originale resta nella storia git (commit f3ab72e e
       precedenti). -->
  <link rel="canonical" href="https://wareraplus.vercel.app/">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">

  <style>
    :root {
      --bg: #0e0f13; --card: #171922; --border: #2a2d3a; --text: #e8e6e1;
      --muted: #9a9aa6; --gold: #d4af37; --gold-soft: rgba(212, 175, 55, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(ellipse at top, #1b1c26 0%, var(--bg) 60%);
      color: var(--text); font-family: 'Sora', system-ui, sans-serif; line-height: 1.55;
    }
    .card {
      width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 26px; box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .badge { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    select {
      background: #10121a; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin: 0 0 8px; line-height: 1.2; }
    h1 span { color: var(--gold); }
    p { margin: 0 0 14px; color: var(--muted); }
    h2 { font-size: 15px; margin: 22px 0 10px; font-weight: 600; }
    ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
    ol li {
      counter-increment: s; position: relative; padding: 10px 12px 10px 46px; margin-bottom: 8px;
      background: var(--gold-soft); border-radius: 10px; font-size: 14px;
    }
    ol li::before {
      content: counter(s); position: absolute; inset-inline-start: 12px; top: 10px;
      width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #111;
      font-size: 12px; font-weight: 600; display: grid; place-items: center;
    }
    [dir="rtl"] ol li { padding: 10px 46px 10px 12px; }
    b { color: var(--text); font-weight: 600; }
    .or { text-align: center; color: var(--muted); font-size: 12px; margin: 4px 0 8px; text-transform: uppercase; letter-spacing: .1em; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
    .btn {
      display: inline-block; background: var(--gold); color: #111; font-weight: 600; text-decoration: none;
      padding: 11px 20px; border-radius: 10px; font-size: 15px;
    }
    .btn:hover { filter: brightness(1.08); }
    .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
    .countdown { font-size: 13px; color: var(--muted); }
    @media (max-width: 420px) { h1 { font-size: 24px; } .card { padding: 22px 18px; } }
  </style>
</head>

<body>
  <main class="card">
    <div class="top">
      <span class="badge">Political View</span>
      <select id="lang" aria-label="Language"></select>
    </div>

    <h1 id="title"></h1>
    <p id="intro"></p>

    <h2 id="howTitle"></h2>
    <ol>
      <li id="step1"></li>
      <li id="step2"></li>
    </ol>
    <div class="or" id="or"></div>
    <ol>
      <li id="menu"></li>
    </ol>

    <div class="actions">
      <a class="btn" id="go" href="https://wareraplus.vercel.app/"></a>
      <span class="countdown" id="countdown"></span>
      <button class="link" id="stay" type="button"></button>
    </div>
  </main>

  <script>
    // ── Testi: 9 lingue, le stesse di WarEra+ (EN/IT/ES/DE/FR/NL/SV/PT/AR).
    //    I nomi di bottoni e voci di menù sono quelli reali dell'app.
    const T = {
      en: {
        title: 'Political View is now part of <span>WarEra+</span>',
        intro: 'Elections, parties, congress and senate are still all here — they just live inside WarEra+, together with the diplomacy map and much more.',
        howTitle: 'How to find the political view',
        step1: '<b>Click a nation</b> on the map: its side panel opens.',
        step2: 'Press <b>🏛️ Expand — Political Situation</b>. From the panel you can also open the <b>Senate</b> directly.',
        or: 'or',
        menu: 'From the top menu: <b>Insights → Politics</b> (on mobile, open the menu ☰ first).',
        go: 'Open WarEra+', stay: 'Stay on this page',
        countdown: n => `Redirecting in ${n} s…`, stopped: 'Redirect paused.'
      },
      it: {
        title: 'Political View ora fa parte di <span>WarEra+</span>',
        intro: 'Elezioni, partiti, congresso e senato ci sono ancora tutti: vivono dentro WarEra+, insieme alla mappa diplomatica e a molto altro.',
        howTitle: 'Come trovare la parte politica',
        step1: '<b>Clicca una nazione</b> sulla mappa: si apre il suo pannello laterale.',
        step2: 'Premi <b>🏛️ Espandi — Situazione Politica</b>. Dal pannello puoi anche aprire direttamente il <b>Senato</b>.',
        or: 'oppure',
        menu: 'Dal menù in alto: <b>Approfondimenti → Politica</b> (su mobile, apri prima il menù ☰).',
        go: 'Apri WarEra+', stay: 'Resta su questa pagina',
        countdown: n => `Reindirizzamento fra ${n} s…`, stopped: 'Reindirizzamento in pausa.'
      },
      es: {
        title: 'Political View ahora es parte de <span>WarEra+</span>',
        intro: 'Elecciones, partidos, congreso y senado siguen estando todos: ahora viven dentro de WarEra+, junto al mapa diplomático y mucho más.',
        howTitle: 'Cómo encontrar la vista política',
        step1: '<b>Haz clic en una nación</b> del mapa: se abre su panel lateral.',
        step2: 'Pulsa <b>🏛️ Expandir — Situación Política</b>. Desde el panel también puedes abrir directamente el <b>Senado</b>.',
        or: 'o',
        menu: 'Desde el menú superior: <b>Análisis → Política</b> (en móvil, abre primero el menú ☰).',
        go: 'Abrir WarEra+', stay: 'Quedarme en esta página',
        countdown: n => `Redirigiendo en ${n} s…`, stopped: 'Redirección en pausa.'
      },
      de: {
        title: 'Political View ist jetzt Teil von <span>WarEra+</span>',
        intro: 'Wahlen, Parteien, Kongress und Senat sind alle noch da — sie leben jetzt in WarEra+, zusammen mit der Diplomatiekarte und vielem mehr.',
        howTitle: 'So findest du die politische Ansicht',
        step1: '<b>Klicke auf eine Nation</b> auf der Karte: ihr Seitenpanel öffnet sich.',
        step2: 'Drücke <b>🏛️ Erweitern — Politische Situation</b>. Im Panel kannst du auch direkt den <b>Senat</b> öffnen.',
        or: 'oder',
        menu: 'Über das obere Menü: <b>Einblicke → Politik</b> (auf dem Handy zuerst das Menü ☰ öffnen).',
        go: 'WarEra+ öffnen', stay: 'Auf dieser Seite bleiben',
        countdown: n => `Weiterleitung in ${n} s…`, stopped: 'Weiterleitung pausiert.'
      },
      fr: {
        title: 'Political View fait désormais partie de <span>WarEra+</span>',
        intro: 'Élections, partis, congrès et sénat sont toujours là : ils vivent maintenant dans WarEra+, avec la carte diplomatique et bien plus.',
        howTitle: 'Comment trouver la vue politique',
        step1: '<b>Cliquez sur une nation</b> sur la carte : son panneau latéral s’ouvre.',
        step2: 'Appuyez sur <b>🏛️ Développer — Situation Politique</b>. Depuis le panneau, vous pouvez aussi ouvrir directement le <b>Sénat</b>.',
        or: 'ou',
        menu: 'Depuis le menu du haut : <b>Analyses → Politique</b> (sur mobile, ouvrez d’abord le menu ☰).',
        go: 'Ouvrir WarEra+', stay: 'Rester sur cette page',
        countdown: n => `Redirection dans ${n} s…`, stopped: 'Redirection en pause.'
      },
      nl: {
        title: 'Political View is nu onderdeel van <span>WarEra+</span>',
        intro: 'Verkiezingen, partijen, congres en senaat zijn er allemaal nog — ze zitten nu in WarEra+, samen met de diplomatieke kaart en veel meer.',
        howTitle: 'Zo vind je de politieke weergave',
        step1: '<b>Klik op een natie</b> op de kaart: het zijpaneel opent.',
        step2: 'Druk op <b>🏛️ Uitbreiden — Politieke Situatie</b>. Vanuit het paneel kun je ook direct de <b>Senaat</b> openen.',
        or: 'of',
        menu: 'Via het bovenste menu: <b>Inzichten → Politiek</b> (op mobiel eerst het menu ☰ openen).',
        go: 'WarEra+ openen', stay: 'Op deze pagina blijven',
        countdown: n => `Doorsturen over ${n} s…`, stopped: 'Doorsturen gepauzeerd.'
      },
      sv: {
        title: 'Political View är nu en del av <span>WarEra+</span>',
        intro: 'Val, partier, kongress och senat finns fortfarande kvar — de ligger nu i WarEra+, tillsammans med diplomatikartan och mycket mer.',
        howTitle: 'Så hittar du den politiska vyn',
        step1: '<b>Klicka på en nation</b> på kartan: dess sidopanel öppnas.',
        step2: 'Tryck på <b>🏛️ Expandera — Politisk Situation</b>. Från panelen kan du också öppna <b>Senaten</b> direkt.',
        or: 'eller',
        menu: 'Från toppmenyn: <b>Insikter → Politik</b> (på mobilen, öppna först menyn ☰).',
        go: 'Öppna WarEra+', stay: 'Stanna på den här sidan',
        countdown: n => `Omdirigerar om ${n} s…`, stopped: 'Omdirigering pausad.'
      },
      pt: {
        title: 'Political View agora faz parte do <span>WarEra+</span>',
        intro: 'Eleições, partidos, congresso e senado continuam todos aqui — agora vivem dentro do WarEra+, junto com o mapa diplomático e muito mais.',
        howTitle: 'Como encontrar a vista política',
        step1: '<b>Clique numa nação</b> no mapa: abre-se o seu painel lateral.',
        step2: 'Carregue em <b>🏛️ Expandir — Situação Política</b>. No painel também pode abrir diretamente o <b>Senado</b>.',
        or: 'ou',
        menu: 'No menu superior: <b>Análises → Política</b> (no telemóvel, abra primeiro o menu ☰).',
        go: 'Abrir WarEra+', stay: 'Ficar nesta página',
        countdown: n => `A redirecionar em ${n} s…`, stopped: 'Redirecionamento em pausa.'
      },
      ar: {
        title: 'أصبح Political View جزءًا من <span>WarEra+</span>',
        intro: 'الانتخابات والأحزاب والكونغرس ومجلس الشيوخ ما زالت كلها موجودة، لكنها الآن داخل WarEra+ مع الخريطة الدبلوماسية والكثير غيرها.',
        howTitle: 'كيف تجد العرض السياسي',
        step1: '<b>انقر على دولة</b> في الخريطة: تُفتح لوحتها الجانبية.',
        step2: 'اضغط <b>🏛️ توسيع — الوضع السياسي</b>. ومن اللوحة يمكنك أيضًا فتح <b>مجلس الشيوخ</b> مباشرة.',
        or: 'أو',
        menu: 'من القائمة العلوية: <b>رؤى ← السياسة</b> (على الهاتف، افتح القائمة ☰ أولًا).',
        go: 'افتح WarEra+', stay: 'البقاء في هذه الصفحة',
        countdown: n => `إعادة التوجيه خلال ${n} ث…`, stopped: 'تم إيقاف إعادة التوجيه مؤقتًا.'
      }
    };
    const NAMES = { en: 'English', it: 'Italiano', es: 'Español', de: 'Deutsch', fr: 'Français', nl: 'Nederlands', sv: 'Svenska', pt: 'Português', ar: 'العربية' };

    // ── Destinazione: WarEra+ live. Se il vecchio link portava ?country=<id>
    //    (o l'utente aveva una nazione salvata qui), la si passa avanti:
    //    WarEra+ con ?country= apre subito il pannello di quella nazione,
    //    cioè esattamente dove sta il bottone "Espandi".
    let country = null;
    try { country = new URLSearchParams(location.search).get('country') || localStorage.getItem('preferredCountryId'); } catch (_) {}
    const target = 'https://wareraplus.vercel.app/' + (country ? '?country=' + encodeURIComponent(country) : '');
    document.getElementById('go').href = target;

    // ── Lingua: quella scelta nel vecchio tool (we_lang, stessa origin),
    //    altrimenti quella del browser, altrimenti inglese.
    let lang = 'en';
    try {
      const saved = localStorage.getItem('we_lang');
      const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
      lang = T[saved] ? saved : (T[nav] ? nav : 'en');
    } catch (_) {}

    const sel = document.getElementById('lang');
    for (const k in NAMES) sel.add(new Option(NAMES[k], k));

    let left = 20, timer = null, paused = false;

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      sel.value = lang;
      for (const id of ['title', 'intro', 'howTitle', 'step1', 'step2', 'or', 'menu', 'go', 'stay'])
        document.getElementById(id).innerHTML = t[id];
      document.getElementById('countdown').textContent = paused ? t.stopped : t.countdown(left);
      document.getElementById('stay').hidden = paused;
    }

    sel.addEventListener('change', () => {
      lang = sel.value;
      try { localStorage.setItem('we_lang', lang); } catch (_) {}
      render();
    });

    // Tempo per leggere, poi si va. Qualunque interazione con la pagina
    // (cambio lingua compreso) non ferma il conto: lo ferma solo "Resta".
    timer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(timer); location.replace(target); return; }
      render();
    }, 1000);

    document.getElementById('stay').addEventListener('click', () => {
      clearInterval(timer); paused = true; render();
    });

    render();
  </script>
  <noscript>
    <p style="text-align:center">Political View → <a href="https://wareraplus.vercel.app/" style="color:#d4af37">wareraplus.vercel.app</a></p>
  </noscript>
</body>

</html>
